<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Natural language mapped to executable script fields</title>
  <desc id="desc">A Chinese story sentence is decomposed into scene context, subject, and action or state fields.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#18181b" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#eef0ef"/>
  <text x="120" y="105" fill="#10b981" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="5">NATURAL LANGUAGE STORY</text>

  <g filter="url(#shadow)">
    <rect x="120" y="145" width="1360" height="230" rx="28" fill="#ffffff"/>
  </g>
  <text x="180" y="214" fill="#71717a" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">RAW STORY TEXT</text>

  <g font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="40" font-weight="650" text-anchor="middle">
    <rect x="180" y="251" width="180" height="72" rx="14" fill="#f7d7d4"/>
    <text x="270" y="302" fill="#7c363c">刘小树</text>

    <rect x="384" y="251" width="180" height="72" rx="14" fill="#e6e3f3"/>
    <text x="474" y="302" fill="#555079">从厨房</text>

    <rect x="588" y="251" width="180" height="72" rx="14" fill="#dceef9"/>
    <text x="678" y="302" fill="#315f7d">走出来</text>

    <rect x="792" y="251" width="220" height="72" rx="14" fill="#f4f4f5"/>
    <text x="902" y="302" fill="#71717a">，手上还</text>

    <rect x="1036" y="251" width="140" height="72" rx="14" fill="#dceef9"/>
    <text x="1106" y="302" fill="#315f7d">捧着</text>

    <rect x="1200" y="251" width="220" height="72" rx="14" fill="#f7d7d4"/>
    <text x="1310" y="302" fill="#7c363c">半个西瓜</text>
  </g>

  <line x1="800" y1="390" x2="800" y2="535" stroke="#10b981" stroke-width="4" stroke-dasharray="10 12" marker-end="url(#arrow)"/>
  <text x="836" y="464" fill="#71717a" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="600" letter-spacing="1">DECOMPOSE &amp; NORMALIZE</text>

  <text x="120" y="580" fill="#10b981" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="5">EXECUTABLE SCRIPT FIELDS</text>

  <g font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">
    <g>
      <rect x="120" y="625" width="405" height="155" rx="24" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
      <text x="160" y="682" fill="#71717a" font-size="20" font-weight="700" letter-spacing="2">SCENE CONTEXT</text>
      <text x="160" y="745" fill="#18181b" font-size="38" font-weight="700">厨房</text>
    </g>
    <g>
      <rect x="548" y="625" width="405" height="155" rx="24" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
      <text x="588" y="682" fill="#71717a" font-size="20" font-weight="700" letter-spacing="2">SUBJECT</text>
      <text x="588" y="745" fill="#18181b" font-size="38" font-weight="700">刘小树</text>
    </g>
    <g>
      <rect x="976" y="625" width="504" height="155" rx="24" fill="#effaf6" stroke="#8ee7c5" stroke-width="2"/>
      <text x="1016" y="682" fill="#08795a" font-size="20" font-weight="700" letter-spacing="2">ACTION / STATE</text>
      <text x="1016" y="745" fill="#075f49" font-size="38" font-weight="700">走出来 · 捧着</text>
    </g>
  </g>
</svg>
