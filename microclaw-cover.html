<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MicroClaw — Cover · Bingnan Jiang</title>
  <meta name="description" content="Cover artwork for the MicroClaw case study — the mascot doing six kinds of work.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- ?embed → bare mode: render only the .cover-stage (no switcher / caption),
       full-bleed, so the home page can iframe it as work card 03's visual.
       Set on <html> before body paints to avoid a chrome flash. -->
  <script>if (location.search.indexOf('embed') > -1) document.documentElement.classList.add('embed');</script>
  <style>
    :root {
      --bg: #f4f4f5;
      --ink: #18181b;
      --soft: #3f3f46;
      --muted: #71717a;
      --faint: #a1a1aa;
      --line: #e4e4e7;
      --line-strong: #d4d4d8;
      --card: #ffffff;
      --radius-lg: 22px;

      /* Cover stage geometry — work-card 16:10 */
      --cover-w: 1080px;
      --cover-ar: 16 / 10;

      font-family: "Space Grotesk", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      gap: 22px;
      padding: 34px 20px;
      color: var(--ink);
      background: radial-gradient(120% 120% at 50% 0%, #ffffff 0%, #ececee 60%, #e6e6e9 100%);
      -webkit-font-smoothing: antialiased;
      font-family: Inter, "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* ---------------- Studio chrome (not part of the cover) ---------------- */
    .switcher { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .switcher button {
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      letter-spacing: .3px;
      color: var(--soft);
      background: #fff;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 7px 14px 7px 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all .18s ease;
    }
    .switcher button:hover { border-color: var(--muted); }
    .switcher button.is-on { background: var(--ink); color: #fff; border-color: var(--ink); }
    .switcher .sw-dot { width: 13px; height: 13px; border-radius: 50%; border: 1px solid rgba(0,0,0,.12); flex: none; }

    /* ---------------- Export frame ---------------- */
    .cover-stage {
      position: relative;
      width: min(var(--cover-w), calc(100vw - 40px));
      aspect-ratio: var(--cover-ar);
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--cover-bg, #eceae4);
      box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 24px 60px -28px rgba(24,24,27,.34);
      transition: background .3s ease;
    }

    /* Eight mascots — 4 across, 2 down */
    .mascot-grid {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 1fr);
      align-items: center;
      justify-items: center;
      /* Roomier margins — bigger outer padding and inter-cell gap */
      padding: clamp(40px, 7%, 84px) clamp(40px, 6.5%, 80px);
      gap: clamp(18px, 3.4%, 40px);
    }
    .mascot-cell {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mascot-cell img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      /* GIF edges were matted light; a whisper of shadow seats them on tinted grounds */
      filter: drop-shadow(0 8px 14px rgba(24,24,27,.10));
    }

    /* Confetti — ported 1:1 from the product's ConfettiBurst
       (microclaw-steps.html). The canvas spans the whole cover so the burst
       flies across the entire stage; the emission point stays pinned to the
       party-popper cell (computed at launch). */
    .cover-stage > .iw-confetti-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    /* Party-popper cell now uses the welcome mascot's own fold↔expand toggle —
       the exact pairing from the steps welcome (welcom_fold ↔ welcom_expand),
       scaled up 1.5× so it reads as the celebration hero. The confetti fires in
       phase with iw-toggle-expand (both 4s loops; expand visible at 24% = 960ms). */
    .mascot-cell--confetti .iw-mascot-toggle {
      position: relative;
      width: 100%;
      height: 100%;
      transform: scale(1.5);
      transform-origin: center;
      z-index: 2;
    }
    .mascot-cell--confetti .iw-mascot-fold,
    .mascot-cell--confetti .iw-mascot-expand {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .mascot-cell--confetti .iw-mascot-fold   { animation: iw-toggle-fold 4s ease-in-out infinite; }
    .mascot-cell--confetti .iw-mascot-expand { animation: iw-toggle-expand 4s ease-in-out infinite; }
    @keyframes iw-toggle-fold {
      0%   { opacity: 1; }
      18%  { opacity: 1; }
      24%  { opacity: 0; }
      88%  { opacity: 0; }
      94%  { opacity: 1; }
      100% { opacity: 1; }
    }
    @keyframes iw-toggle-expand {
      0%   { opacity: 0; }
      18%  { opacity: 0; }
      24%  { opacity: 1; transform: translateY(0) scale(1); }
      30%  { transform: translateY(-2px) scale(1.04); }
      40%  { transform: translateY(0) scale(1); }
      88%  { opacity: 1; }
      94%  { opacity: 0; }
      100% { opacity: 0; }
    }

    .caption {
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      letter-spacing: .4px;
      color: var(--muted);
      text-align: center;
    }
    .caption b { color: var(--soft); font-weight: 600; }

    /* ---------------- Embed mode (?embed) ---------------- */
    /* Strip the studio chrome and let the rounded stage fill the frame, so the
       home page can drop this straight into work card 03's visual band. The
       stage keeps its own radius + shadow — that's the visual edge. */
    html.embed body {
      min-height: 100vh;
      padding: 0;
      gap: 0;
      background: transparent;
    }
    html.embed .switcher,
    html.embed .caption { display: none; }
    html.embed .cover-stage {
      /* Fill the iframe on BOTH axes so the stage reaches every edge of the
         band. The HOST (.work-card .visual--live) now owns the rounded-corner
         clip — so square the stage here. Rounding here instead would re-expose
         the bug this fixes: the confetti <canvas> and scale(1.5) mascot are
         compositing layers, and a nested compositing layer escapes the stage's
         own border-radius+overflow clip, poking square corners through. Let the
         host (no compositing child at its corners) do the clipping. */
      width: 100vw;
      height: 100vh;
      max-width: none;
      aspect-ratio: auto;
      border-radius: 0;
      box-shadow: none;
    }
  </style>
</head>
<body>

  <div class="switcher" id="bgSwitcher" role="group" aria-label="Background colour">
    <button data-bg="#eceae4" class="is-on"><span class="sw-dot" style="background:#eceae4"></span>Warm grey</button>
    <button data-bg="#f4f4f5"><span class="sw-dot" style="background:#f4f4f5"></span>Neutral</button>
    <button data-bg="#eef1ee"><span class="sw-dot" style="background:#eef1ee"></span>Soft mint</button>
    <button data-bg="#efeaf3"><span class="sw-dot" style="background:#efeaf3"></span>Soft lilac</button>
    <button data-bg="#1c1c1f"><span class="sw-dot" style="background:#1c1c1f"></span>Ink</button>
  </div>

  <div class="cover-stage" id="stage" style="--cover-bg:#eceae4">
    <div class="mascot-grid">
      <div class="mascot-cell"><img src="assets/emoji_recording.webp" alt="MicroClaw mascot recording"></div>
      <div class="mascot-cell mascot-cell--confetti">
        <div class="iw-mascot-toggle">
          <img class="iw-mascot-fold" src="assets/welcom_fold.webp" alt="MicroClaw mascot folded">
          <img class="iw-mascot-expand" src="assets/welcom_expand.webp" alt="MicroClaw mascot expanded, welcoming">
        </div>
      </div>
      <div class="mascot-cell"><img src="assets/crash.webp" alt="MicroClaw mascot after a crash"></div>
      <div class="mascot-cell"><img src="assets/binoculars.webp" alt="MicroClaw mascot scouting with binoculars"></div>
      <div class="mascot-cell"><img src="assets/paperfall.gif" alt="MicroClaw mascot buried in falling paper"></div>
      <div class="mascot-cell"><img src="assets/error.webp" alt="MicroClaw mascot hitting an error"></div>
      <div class="mascot-cell"><img src="assets/openclaw_search_preview_transparent.gif" alt="MicroClaw mascot searching"></div>
      <div class="mascot-cell"><img src="assets/map.webp" alt="MicroClaw mascot planning on a map"></div>
    </div>
    <canvas class="iw-confetti-canvas" aria-hidden="true"></canvas>
  </div>

  <p class="caption"><b>MicroClaw</b> · one mascot, eight kinds of work — cover for case 03</p>

  <script>
    const stage = document.getElementById('stage');
    const sw = document.getElementById('bgSwitcher');
    sw.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      stage.style.setProperty('--cover-bg', btn.dataset.bg);
      sw.querySelectorAll('button').forEach(b => b.classList.toggle('is-on', b === btn));
    });

    /* Confetti burst — ported 1:1 from ConfettiBurst in microclaw-steps.html
       (the First-Win welcome). Same colours, particle count, gravity, drift and
       decay. The canvas now spans the whole stage, so the burst flies across the
       entire cover; the emission point is measured from the party-popper cell
       each launch so it stays pinned to that mascot. */
    (function confettiBurst(canvas, originCell, { interval = 4000, delay = 900 } = {}) {
      if (!canvas || !originCell) return;
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const ctx = canvas.getContext('2d');
      const colors = ["#e8533a", "#f5a623", "#4cd964", "#5ac8fa", "#af52de", "#ff2d55", "#ffcc00", "#34aadc"];
      let particles = [];
      let rafId = null;

      function resize() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
      }
      resize();
      new ResizeObserver(resize).observe(canvas);

      function origin() {
        // Horizontally centred on the stage. Vertically: start at the
        // party-popper cell's row, then lift by a quarter of that cell's
        // distance to the top edge (new y = cellY − cellY/4).
        const cr = canvas.getBoundingClientRect();
        const or = originCell.getBoundingClientRect();
        const cellY = (or.top + or.height / 2 - cr.top) / cr.height * canvas.height;
        return {
          x: canvas.width / 2,
          y: cellY - cellY / 4,
        };
      }

      function launch() {
        const { x: cx, y: cy } = origin();
        for (let i = 0; i < 90; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2 + Math.random() * 4;
          particles.push({
            x: cx, y: cy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1.5,
            w: 5 + Math.random() * 5,
            h: 2.5 + Math.random() * 3.5,
            color: colors[Math.floor(Math.random() * colors.length)],
            angle: Math.random() * Math.PI * 2,
            spin: (Math.random() - 0.5) * 0.15,
            alpha: 1,
            decay: 0.006 + Math.random() * 0.004,
            driftFreq: 0.02 + Math.random() * 0.02,
            driftAmp: 0.3 + Math.random() * 0.5,
            driftT: Math.random() * Math.PI * 2,
          });
        }
        if (!rafId) rafId = requestAnimationFrame(draw);
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let alive = false;
        for (const p of particles) {
          if (p.alpha <= 0) continue;
          alive = true;
          p.vy += 0.035;
          p.vy *= 0.99;
          p.vx *= 0.995;
          p.driftT += p.driftFreq;
          p.x += p.vx + Math.sin(p.driftT) * p.driftAmp;
          p.y += p.vy;
          p.angle += p.spin;
          p.alpha -= p.decay;
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.translate(p.x, p.y);
          ctx.rotate(p.angle);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        }
        particles = particles.filter((p) => p.alpha > 0);
        if (alive) {
          rafId = requestAnimationFrame(draw);
        } else {
          rafId = null;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }

      setTimeout(() => { launch(); setInterval(launch, interval); }, delay);
    })(
      document.querySelector('.cover-stage > .iw-confetti-canvas'),
      document.querySelector('.mascot-cell--confetti'),
      // Fire when welcome_expand appears: the steps welcome toggle is a 4s loop
      // and iw-toggle-expand turns visible at 24% → 0.24 × 4000 = 960ms, then
      // every 4000ms in phase with the loop.
      { interval: 4000, delay: 960 }
    );
  </script>
</body></html>
